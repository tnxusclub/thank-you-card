<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNXUS Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            /* ==============================================
               🔑 GANTI BACKGROUND FOTO DI SINI!
               ============================================== */
            background: url('https://github.com/tnxusclub/thank-you-card/blob/df7e6ddea32d86b0a5f2da433fa14290c5a37616/WhatsApp%20Image%202026-08-21%20at%2012.59.21.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 35px;
            opacity: 0.9;
            font-size: 1rem;
        }

        /* 🟠 SEMUA TOMBOL ORANYE GRADASI */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px 20px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.35);
        }

        .logo {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TNXUS CLUB</h1>
        <p>Ikuti kami di media sosial</p>

        <!-- 📷 Instagram -->
        <a href="https://instagram.com/GantiUsernameKamu" target="_blank" class="btn">
            <div class="logo">

                </svg>

            Instagram

        <!-- 🎵 TikTok -->

            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path fill="white" d="M19.59,6.69a4.83,4.83,0,0,1-3.77-4.25V2h-3.45V15.94a2.91,2.91,0,0,1-5.14,1.9,2.87,2.87,0,0,1-.61-1.81,2.91,2.91,0,0,1,5.56-1.21V11.24a6.34,6.34,0,0,0-1-.08,6.3,6.3,0,0,0,0,12.6,6.3,6.3,0,0,0,6.3-6.3V9.42A8.16,8.16,0,0,0,22,10.89V7.44A4.85,4.85,0,0,1,19.59,6.69Z"/>
                </svg>
            </div>

        <!-- 🌐 TNXUS CLUB - LOGO WEB PUTIH (DIKUNCI FILL=white) -->
        <a href="https://link-tnxus-club-kamu.com" target="_blank" class="btn">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path fill="white" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>

    </div>

</body>
</html>
